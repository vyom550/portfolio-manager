<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--card2:#f0f3f9;--text:#18202e;--muted:#667085;--border:#dde3ee;
  --accent:#4f46e5;--accent-t:#fff;--good:#0f9d58;--bad:#d93025;--warn:#d98a00;
  --goodbg:#e3f6ec;--badbg:#fde8e6;--warnbg:#fff3d6;--shadow:0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme=dark]{
  --bg:#0f141c;--card:#171e29;--card2:#1e2736;--text:#e6ebf3;--muted:#93a0b5;--border:#2a3548;
  --accent:#818cf8;--accent-t:#0f141c;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;
  --goodbg:#12301f;--badbg:#3a1a1a;--warnbg:#3a2e10;--shadow:none;
}
@media (prefers-color-scheme:dark){
  :root[data-theme=auto]{
    --bg:#0f141c;--card:#171e29;--card2:#1e2736;--text:#e6ebf3;--muted:#93a0b5;--border:#2a3548;
    --accent:#818cf8;--accent-t:#0f141c;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;
    --goodbg:#12301f;--badbg:#3a1a1a;--warnbg:#3a2e10;--shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:1100px;margin:0 auto}
header.top h1{font-size:1.2rem;margin:0}
header.top h1 small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:0 auto;padding:6px 12px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.active{background:var(--accent);color:var(--accent-t)}
main{max-width:1100px;margin:0 auto;padding:14px 12px calc(60px + env(safe-area-inset-bottom))}
.welcome{max-width:640px;margin:20px auto}
.welcome textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1rem;margin:0 0 10px}
.card h3{font-size:.9rem;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .lbl{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:1.55rem;font-weight:700;margin:2px 0}
.kpi .sub{color:var(--muted);font-size:.82rem}
.pos{color:var(--good)}.neg{color:var(--bad)}.warnc{color:var(--warn)}.muted{color:var(--muted)}
.bar{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--bad)}.bar.mid>i{background:var(--warn)}
.alert{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:.9rem;border:1px solid transparent}
.alert.bad{background:var(--badbg);border-color:var(--bad)}
.alert.warn{background:var(--warnbg);border-color:var(--warn)}
.alert.good{background:var(--goodbg);border-color:var(--good)}
.alert.info{background:var(--card2);border-color:var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.badge.good{background:var(--goodbg);color:var(--good);border-color:var(--good)}
.badge.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--border)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
td input[type=number]{width:96px;text-align:right}
td input[type=text]{width:100%;min-width:90px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:active{transform:translateY(1px)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:8px 0}
.form label{display:flex;flex-direction:column;font-size:.74rem;color:var(--muted);gap:3px}
.form input[type=number]{width:110px}
.form input.wide{width:200px}
.rowline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}
.rowline:last-child{border-bottom:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.risk{border:2px solid var(--warn);background:var(--warnbg)}
.risk h2{color:var(--warn)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:4px}
.legend b{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.jentry{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card2)}
.jhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.jmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin:4px 0}
.jtxt{font-size:.88rem;margin:3px 0;white-space:pre-wrap;word-break:break-word}
.jtxt b{color:var(--muted);font-weight:600}
.thumb{max-width:130px;max-height:96px;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;margin-top:6px;display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.overlay img{max-width:95vw;max-height:95vh;border-radius:8px}
textarea{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%;min-height:60px;resize:vertical;font:inherit;color:inherit}
.form label.full{flex:1 1 100%}
.form label.half{flex:1 1 240px}
.form select{min-width:90px}
.tabpane{display:none}.tabpane.active{display:block}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.small{font-size:.82rem}
.mt{margin-top:12px}
@media (max-width:600px){
  th,td{padding:6px 5px}
  .kpi .val{font-size:1.3rem}
  td input[type=number]{width:80px}
}

<body>
<header class="top">
  <h1>Personal Finance Dashboard<small>GBP · Budget · Debts · Vantage trading · stored in this browser only</small></h1>
  <div class="hbtns">
    <button class="btn sec sm" data-action="export">⬇ Export JSON</button>
    <button class="btn sec sm" data-action="import">⬆ Import JSON</button>
  </div>
</header>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<main id="main"></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="shotFile" accept="image/*" hidden>
<input type="file" id="csvFile" accept=".csv,.txt,text/csv" hidden>
<div id="toastBox"></div>

<script>
(function(){
'use strict';
var KEY='ukFinanceDash.v1';
var TABS=[['overview','Overview'],['budget','Budget'],['debts','Debts'],['trading','Trading (Vantage)'],['journal','Journal'],['settings','Settings']];

/* ---------- helpers ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=typeof v==='number'?v:parseFloat(v);return isFinite(n)?n:0;}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function money(n,signed){
  n=num(n);var neg=n<0&&Math.abs(n)>=0.005;var s='£'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  return neg?'-'+s:(signed&&n>=0.005?'+'+s:s);
}
function pct(n,d){return (n==null||!isFinite(n))?'–':n.toFixed(d==null?1:d)+'%';}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function monthKey(s){return String(s).slice(0,7);}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:esc(s||'');}
function monthLabel(k){var m=/^(\d{4})-(\d{2})/.exec(k);return m?MON[+m[2]-1]+' '+m[1]:k;}
function addMonths(k,n){var y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1);}
function parseYMD(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(NaN);}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function cls(n){return n>0.004?'pos':(n<-0.004?'neg':'');}
function toast(msg){
  var el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(function(){el.remove();},3500);
}

/* ---------- default state ---------- */
function defaults(){
  return {
    version:1,
    settings:{income:0,debtBudget:0,allowance:0,weeklyAllowance:0,paydayDay:28,theme:'auto'},
    essentials:[
      {id:uid(),name:'Rent',amount:0},
      {id:uid(),name:'Bills',amount:0},
      {id:uid(),name:'Food',amount:0},
      {id:uid(),name:'Travel',amount:0}
    ],
    expenses:[],
    debts:[],
    payments:[],
    trading:{
      balance:0,riskCap:0,maxDailyLoss:0,
      deposits:[],withdrawals:[],trades:[]
    },
    checklist:{},
    weeklyReviews:{}
  };
}
var state=load();
function load(){
  var d=defaults();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw);return merge(d,s);}
  }catch(e){console.warn('load failed',e);}
  return d;
}
function merge(d,s){
  if(!s||typeof s!=='object')return d;
  var out=d;
  ['settings'].forEach(function(k){if(s[k])Object.keys(s[k]).forEach(function(f){out[k][f]=s[k][f];});});
  if(s.trading)Object.keys(s.trading).forEach(function(f){out.trading[f]=s.trading[f];});
  ['essentials','expenses','debts','payments'].forEach(function(k){if(Array.isArray(s[k]))out[k]=s[k];});
  ['deposits','withdrawals','trades'].forEach(function(k){if(!Array.isArray(out.trading[k]))out.trading[k]=[];});
  if(s.checklist&&typeof s.checklist==='object')out.checklist=s.checklist;
  if(s.weeklyReviews&&typeof s.weeklyReviews==='object'&&!Array.isArray(s.weeklyReviews))out.weeklyReviews=s.weeklyReviews;
  out.trading.trades=out.trading.trades.filter(function(t){return t&&typeof t==='object';}).map(function(t){if(!t.id)t.id=uid();return t;});
  return out;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Could not save: '+e.message);}}

/* ---------- calculations ---------- */
function debtApr(d){
  if(d.monthlyInterest==null||d.monthlyInterest===''||!(num(d.balance)>0))return null;
  return num(d.monthlyInterest)*12/num(d.balance)*100;
}
function totalDebt(){return r2(state.debts.reduce(function(a,d){return a+Math.max(0,num(d.balance));},0));}
function totalStart(){return r2(state.debts.reduce(function(a,d){return a+Math.max(num(d.startBalance),num(d.balance));},0));}

function firstPayMonth(){
  var now=new Date();var k=now.getFullYear()+'-'+pad(now.getMonth()+1);
  return now.getDate()>num(state.settings.paydayDay)?addMonths(k,1):k;
}
function orderedDebts(debts){
  var list=debts.filter(function(d){return num(d.balance)>0.004;});
  return list.slice().sort(function(a,b){
    var pa=debtApr(a),pb=debtApr(b);
    if(pa==null&&pb==null)return 0;
    if(pa==null)return 1;if(pb==null)return -1;
    return pb-pa;
  });
}
function simulate(debts,budget,startKey){
  var list=debts.map(function(d){
    var bal=Math.max(0,num(d.balance));
    var rate=(d.monthlyInterest==null||d.monthlyInterest===''||bal<=0)?0:num(d.monthlyInterest)/bal;
    return {id:d.id,name:d.name,bal:bal,rate:rate,min:d.min==null||d.min===''?0:num(d.min),apr:debtApr(d)};
  }).filter(function(x){return x.bal>0.004;});
  list.sort(function(a,b){
    if(a.apr==null&&b.apr==null)return 0;if(a.apr==null)return 1;if(b.apr==null)return -1;return b.apr-a.apr;
  });
  var rows=[],totalInt=0,totalPaid=0,m=0,MAX=600;
  var startTotal=list.reduce(function(a,x){return a+x.bal;},0);
  while(list.some(function(x){return x.bal>0.004;})&&m<MAX){
    m++;
    var row={n:m,key:addMonths(startKey,m-1),interest:0,paid:0,debts:{}};
    list.forEach(function(x){
      var i=r2(x.bal*x.rate);x.bal=r2(x.bal+i);row.interest+=i;row.debts[x.id]={interest:i,pay:0};
    });
    var pool=num(budget);
    // minimums first
    list.forEach(function(x){
      if(x.bal<=0.004)return;
      var p=Math.min(x.min,x.bal);
      if(p>0){x.bal=r2(x.bal-p);row.debts[x.id].pay+=p;pool-=p;}
    });
    // avalanche
    list.forEach(function(x){
      if(pool<=0.004||x.bal<=0.004)return;
      var p=Math.min(pool,x.bal);
      x.bal=r2(x.bal-p);row.debts[x.id].pay+=p;pool-=p;
    });
    list.forEach(function(x){row.debts[x.id].bal=x.bal;row.paid+=row.debts[x.id].pay;});
    row.interest=r2(row.interest);row.paid=r2(row.paid);
    row.remaining=r2(list.reduce(function(a,x){return a+x.bal;},0));
    totalInt+=row.interest;totalPaid+=row.paid;
    rows.push(row);
    if(m>=2&&row.remaining>=rows[m-2].remaining-0.004&&row.paid<=0.004){break;} // no progress
  }
  var done=!list.some(function(x){return x.bal>0.004;});
  return {rows:rows,order:list.map(function(x){return {id:x.id,name:x.name,apr:x.apr};}),months:done?rows.length:null,
    done:done,totalInterest:r2(totalInt),totalPaid:r2(totalPaid),startTotal:r2(startTotal),
    finishKey:done&&rows.length?rows[rows.length-1].key:null,
    hasUnknown:list.some(function(x){return x.apr==null;})};
}

function expensesIn(fn){return state.expenses.filter(fn);}
function essentialCats(){return state.essentials.map(function(e){return e.name;});}
function allCats(){var c=essentialCats();['Spending','Other'].forEach(function(x){if(c.indexOf(x)<0)c.push(x);});return c;}
function monthSpend(mk){
  var by={};state.expenses.forEach(function(e){if(monthKey(e.date)===mk){by[e.cat]=r2((by[e.cat]||0)+num(e.amount));}});
  return by;
}
function monthDebtPaid(mk){return r2(state.payments.filter(function(p){return monthKey(p.date)===mk;}).reduce(function(a,p){return a+num(p.amount);},0));}
function weekInfo(offset){
  var ws=addDays(weekStart(new Date()),-7*(offset||0));var we=addDays(ws,6);
  var a=ymd(ws),b=ymd(we);
  var spent=r2(state.expenses.filter(function(e){return e.cat==='Spending'&&e.date>=a&&e.date<=b;}).reduce(function(s,e){return s+num(e.amount);},0));
  var allow=num(state.settings.weeklyAllowance);
  return {start:a,end:b,spent:spent,allow:allow,remaining:r2(allow-spent)};
}
function budgetTotals(){
  var ess=r2(state.essentials.reduce(function(a,e){return a+num(e.amount);},0));
  var s=state.settings;
  return {ess:ess,debt:num(s.debtBudget),allow:num(s.allowance),total:r2(ess+num(s.debtBudget)+num(s.allowance)),income:num(s.income)};
}
function tradingStats(){
  var t=state.trading,tr=t.trades;
  var pnl=r2(tr.reduce(function(a,x){return a+num(x.pnl);},0));
  var wins=tr.filter(function(x){return num(x.pnl)>0;}).length;
  var losses=tr.filter(function(x){return num(x.pnl)<0;}).length;
  var best=null,worst=null;
  tr.forEach(function(x){if(!best||num(x.pnl)>num(best.pnl))best=x;if(!worst||num(x.pnl)<num(worst.pnl))worst=x;});
  var dep=r2(t.deposits.reduce(function(a,x){return a+num(x.amount);},0));
  var wd=r2(t.withdrawals.reduce(function(a,x){return a+num(x.amount);},0));
  var daily={};tr.forEach(function(x){daily[x.date]=r2((daily[x.date]||0)+num(x.pnl));});
  var maxLoss=num(t.maxDailyLoss);
  var breaches=[];
  if(maxLoss>0)Object.keys(daily).sort().forEach(function(d){if(-daily[d]>maxLoss+0.004)breaches.push({date:d,pnl:daily[d]});});
  return {pnl:pnl,count:tr.length,wins:wins,losses:losses,winRate:tr.length?wins/tr.length*100:null,best:best,worst:worst,
    dep:dep,wd:wd,net:r2(dep-wd),calc:r2(dep-wd+pnl),daily:daily,breaches:breaches};
}
function riskWarnings(){
  var t=state.trading,st=tradingStats(),debt=totalDebt(),w=[];
  var cap=num(t.riskCap);
  if(cap<=0){
    if(st.dep>0)w.push(['bad','Trading capital cap is £0 (not set) but you have recorded '+money(st.dep)+' of deposits. Set a cap before depositing more.']);
  }else if(st.net>cap+0.004){
    w.push(['bad','Net deposited capital '+money(st.net)+' exceeds your cap of '+money(cap)+' by '+money(st.net-cap)+'.']);
  }
  if(debt>0&&st.dep>0){
    w.push(['bad','You have trading deposits ('+money(st.dep)+') recorded while you still owe '+money(debt)+' in debt. Consider paying debt first.']);
  }
  st.breaches.forEach(function(b){
    w.push(['bad','Max daily loss breached on '+fmtDate(b.date)+': '+money(b.pnl)+' (limit '+money(t.maxDailyLoss)+').']);
  });
  return w;
}

/* ---------- rendering ---------- */
var ui={jf:{},jOpen:false,editId:null,shot:'',jAll:false,wk:0,shotView:null,tab:'overview',month:todayStr().slice(0,7),showAllTrades:false,showAllSched:false};

function isFirstRun(){try{return localStorage.getItem(KEY)===null;}catch(e){return false;}}

function kpi(l,v,sub,c){return '<div class="card kpi"><div class="lbl">'+l+'</div><div class="val '+(c||'')+'">'+v+'</div><div class="sub">'+(sub||'')+'</div></div>';}
function bar(frac,over){
  var p=Math.max(0,Math.min(1,frac))*100;
  return '<div class="bar '+(over?'over':(frac>0.85?'mid':''))+'"><i style="width:'+p.toFixed(1)+'%"></i></div>';
}
function alertBox(kind,html){return '<div class="alert '+kind+'">'+html+'</div>';}

/* Overview */
function vOverview(){
  var bt=budgetTotals(),td=totalDebt(),st=tradingStats(),mk=todayStr().slice(0,7);
  var sim=simulate(state.debts,state.settings.debtBudget,firstPayMonth());
  var nw=r2(num(state.trading.balance)-td);
  var by=monthSpend(mk);
  var essBudget=bt.ess;
  var spentEss=0;essentialCats().forEach(function(c){spentEss+=by[c]||0;});
  var spentSpend=by['Spending']||0, spentOther=by['Other']||0;
  var totalSpent=r2(Object.keys(by).reduce(function(a,k){return a+by[k];},0));
  var plannedSpend=r2(essBudget+bt.allow);
  var over=totalSpent>plannedSpend+0.004;
  var wk=weekInfo(0);
  var debtPaid=monthDebtPaid(mk);
  var dfText=sim.done?monthLabel(sim.finishKey):(td<=0?'Debt free 🎉':'Not reached');
  var dfSub=sim.done?(sim.months+' month'+(sim.months===1?'':'s')+' at '+money(state.settings.debtBudget)+'/mo'):(td<=0?'':'Payment too low to clear debt');
  var h='<div class="grid g4">';
  h+=kpi('Net worth',money(nw),'Trading '+money(state.trading.balance)+' − debt '+money(td),cls(nw));
  h+=kpi('Total debt',money(td),state.debts.length+' accounts',td>0?'neg':'pos');
  h+=kpi('Debt-free date',dfText,dfSub);
  h+=kpi('Trading net P&L',money(st.pnl,true),st.count+' trades'+(st.winRate!=null?' · '+pct(st.winRate,0)+' win rate':''),cls(st.pnl));
  h+='</div>';
  var ws=riskWarnings();
  if(ws.length)h+='<div class="mt">'+ws.map(function(w){return alertBox(w[0],'⚠ '+esc(w[1]));}).join('')+'</div>';
  if(sim.hasUnknown)h+=alertBox('warn','Amex (or another debt) has an unknown interest rate - add it on the Debts tab; the payoff estimate currently assumes £0 interest on it, so it is optimistic.');
  var unalloc=r2(bt.income-bt.total);
  if(Math.abs(unalloc)>=0.005)h+=alertBox(unalloc<0?'bad':'info','Budget '+(unalloc<0?'over-allocates income by ':'leaves unallocated income of ')+money(Math.abs(unalloc))+'.');
  h+='<div class="grid g2 mt">';
  // budget status
  h+='<div class="card"><h2>This month’s budget status <span class="muted small">'+monthLabel(mk)+'</span></h2>';
  h+='<div class="rowline"><span>Spent (essentials + allowance + other)</span><b>'+money(totalSpent)+' / '+money(plannedSpend)+'</b></div>';
  h+=bar(plannedSpend>0?totalSpent/plannedSpend:0,over);
  h+='<div class="mt">'+(over?'<span class="badge bad">Over budget by '+money(totalSpent-plannedSpend)+'</span>':'<span class="badge good">On track · '+money(plannedSpend-totalSpent)+' left</span>')+'</div>';
  h+='<div class="rowline mt"><span>Essentials</span><span>'+money(spentEss)+' / '+money(essBudget)+'</span></div>';
  h+='<div class="rowline"><span>Spending allowance</span><span>'+money(spentSpend)+' / '+money(bt.allow)+'</span></div>';
  if(spentOther>0)h+='<div class="rowline"><span>Other (unbudgeted)</span><span class="neg">'+money(spentOther)+'</span></div>';
  h+='<div class="rowline"><span>Debt payments logged</span><span>'+money(debtPaid)+' / '+money(bt.debt)+'</span></div>';
  h+='<h3>This week’s allowance</h3><div class="rowline"><span>Remaining ('+fmtDate(wk.start)+' – '+fmtDate(wk.end)+')</span><b class="'+(wk.remaining<0?'neg':'pos')+'">'+money(wk.remaining)+'</b></div>';
  h+=bar(wk.allow>0?wk.spent/wk.allow:0,wk.remaining<0);
  h+='</div>';
  // checklist
  var cl=state.checklist[mk]||{};
  var items=[
    ['essentials','Pay essentials ('+money(bt.ess)+': '+state.essentials.map(function(e){return esc(e.name);}).join(', ')+')'],
    ['debt','Send debt payment first ('+money(bt.debt)+') - then log it on the Debts tab'],
    ['allowance','Move spending allowance to spending account ('+money(bt.allow)+')']
  ];
  var doneN=items.filter(function(i){return cl[i[0]];}).length;
  h+='<div class="card"><h2>Payday checklist <span class="muted small">'+monthLabel(mk)+' · payday '+ordinal(state.settings.paydayDay)+'</span></h2>';
  items.forEach(function(i){
    h+='<label class="check '+(cl[i[0]]?'done':'')+'"><input type="checkbox" data-check="'+i[0]+'" '+(cl[i[0]]?'checked':'')+'><span>'+i[1]+'</span></label>';
  });
  h+='<div class="small muted mt">'+doneN+' of '+items.length+' done'+(doneN===items.length?' ✅':'')+' · resets each month</div>';
  // debt progress
  var start=totalStart(),paid=Math.max(0,start-td);
  h+='<h3>Debt paid off</h3>'+bar(start>0?paid/start:1,false)+'<div class="small muted">'+money(paid)+' of '+money(start)+' ('+pct(start>0?paid/start*100:100,0)+')</div>';
  h+='</div></div>';
  return h;
}
function ordinal(n){n=num(n);var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

/* Debts */

  var start=totalStart(),paid=Math.max(0,start-td);
  var h='<div class="grid g4">';
  h+=kpi('Total debt',money(td),'',td>0?'neg':'pos');

  h+=kpi('Total interest (est.)',money(sim.totalInterest),'over the plan');

  h+='</div>';
  h+='<div class="card mt"><h2>Progress</h2>'+bar(start>0?paid/start:1,false)+'<div class="small muted mt">'+money(paid)+' paid off · '+money(td)+' remaining</div></div>';

  h+='<div class="card mt"><h2>Debts</h2><div class="scroll"><table><thead><tr><th>Name</th><th class="n">Balance £</th><th class="n">Interest £/mo</th><th class="n">Est. APR</th><th class="n">Min pay £</th><th class="n">Started £</th><th></th></tr></thead><tbody>';
  state.debts.forEach(function(d){
    var apr=debtApr(d);var unk=(d.monthlyInterest==null||d.monthlyInterest==='');
    h+='<tr><td><input type="text" data-list="debts" data-id="'+d.id+'" data-field="name" value="'+esc(d.name)+'">'+

      '<td class="n"><input type="number" step="0.01" data-list="debts" data-id="'+d.id+'" data-field="balance" data-type="num" value="'+esc(d.balance)+'"></td>'+
      '<td class="n"><input type="number" step="0.01" placeholder="unknown" data-list="debts" data-id="'+d.id+'" data-field="monthlyInterest" data-type="null" value="'+(unk?'':esc(d.monthlyInterest))+'"></td>'+
      '<td class="n">'+(unk?'<span class="badge">rate unknown - add when available</span>':(apr==null?'–':pct(apr,1)))+'</td>'+
      '<td class="n"><input type="number" step="0.01" placeholder="blank" data-list="debts" data-id="'+d.id+'" data-field="min" data-type="null" value="'+(d.min==null?'':esc(d.min))+'"></td>'+
      '<td class="n"><input type="number" step="0.01" data-list="debts" data-id="'+d.id+'" data-field="startBalance" data-type="num" value="'+esc(d.startBalance)+'"></td>'+
      '<td><button class="btn danger sm" data-action="del-debt" data-id="'+d.id+'">✕</button></td></tr>';
  });
  h+='</tbody><tfoot><tr><td>Total</td><td class="n">'+money(td)+'</td><td class="n">'+money(state.debts.reduce(function(a,d){return a+num(d.monthlyInterest);},0))+'</td><td></td><td></td><td class="n">'+money(start)+'</td><td></td></tr></tfoot></table></div>';
  h+='<div class="form"><button class="btn sec sm" data-action="add-debt">+ Add debt</button></div>';
  h+='<div class="small muted">Est. APR = monthly interest × 12 ÷ balance. Leave interest blank if unknown (placed last in the avalanche order and assumed £0 interest until filled in). “Started” is the original balance, used for the progress bar.</div></div>';

  // planner

  if(mins>num(s.debtBudget)+0.004)h+=alertBox('warn','Minimum payments ('+money(mins)+') exceed your budget; the schedule pays all minimums anyway.');

  else{
    h+='<div class="small"><b>Payoff order:</b> '+sim.order.map(function(o,i){return (i+1)+'. '+esc(o.name)+' ('+(o.apr==null?'rate unknown':pct(o.apr,0))+')';}).join(' → ')+'</div>';

    '<label>Debt<select name="debt">'+state.debts.map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+' ('+money(d.balance)+')</option>';}).join('')+'</select></label>'+
    '<label>Amount (£)<input type="number" name="amount" step="0.01" min="0.01" required></label>'+
    '<label>Note<input type="text" class="wide" name="note" placeholder="optional"></label><button class="btn">Log payment</button></form>';
  h+='<div class="small muted">Logging a payment reduces that debt’s balance immediately; deleting it restores the balance. This month paid: <b>'+money(monthDebtPaid(mk))+'</b> of '+money(s.debtBudget)+'.</div>';
  var ps=state.payments.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  if(ps.length){
    h+='<div class="scroll mt"><table><thead><tr><th>Date</th><th>Debt</th><th class="n">Amount</th><th>Note</th><th></th></tr></thead><tbody>';
    ps.slice(0,100).forEach(function(p){h+='<tr><td>'+fmtDate(p.date)+'</td><td>'+esc(p.debtName)+'</td><td class="n">'+money(p.amount)+'</td><td>'+esc(p.note)+'</td><td><button class="btn danger sm" data-action="del-payment" data-id="'+p.id+'">✕</button></td></tr>';});
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;

function drawEquity(){
  var el=document.getElementById('equity');if(!el)return;
  var t=state.trading,ev=[];
  t.deposits.forEach(function(x){ev.push({d:x.date,eq:num(x.amount),pn:0});});
  t.withdrawals.forEach(function(x){ev.push({d:x.date,eq:-num(x.amount),pn:0});});
  t.trades.forEach(function(x){ev.push({d:x.date,t:x.time||'',eq:num(x.pnl),pn:num(x.pnl)});});
  if(!ev.length){el.innerHTML='<div class="muted">Add deposits and trades to see the equity curve.</div>';return;}
  ev.sort(function(a,b){var ka=a.d+' '+(a.t||''),kb=b.d+' '+(b.t||'');return ka<kb?-1:(ka>kb?1:0);});
  var pts=[{d:ev[0].d,e:0,p:0}],e=0,p=0;
  ev.forEach(function(x){e=r2(e+x.eq);p=r2(p+x.pn);pts.push({d:x.d,e:e,p:p});});
  var W=700,H=260,L=56,R=12,T=12,B=28;
  var vals=pts.map(function(x){return x.e;}).concat(pts.map(function(x){return x.p;})).concat([0]);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx===mn){mx+=1;mn-=1;}
  var pad_=(mx-mn)*0.08;mn-=pad_;mx+=pad_;
  function X(i){return L+(pts.length===1?0:i/(pts.length-1))*(W-L-R);}
  function Y(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B);}
  function path(k){return pts.map(function(q,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(q[k]).toFixed(1);}).join(' ');}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Equity curve">';
  for(var i=0;i<=4;i++){
    var v=mn+(mx-mn)*i/4,y=Y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">£'+Math.round(v)+'</text>';
  }
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/>';
  s+='<path d="'+path('p')+'" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round"/>';
  s+='<path d="'+path('e')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  if(pts.length<80)pts.forEach(function(q,i){s+='<circle cx="'+X(i)+'" cy="'+Y(q.e)+'" r="2.5" fill="var(--accent)"/>';});
  s+='<text x="'+L+'" y="'+(H-8)+'">'+fmtDate(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmtDate(pts[pts.length-1].d)+'</text></svg>';
  el.innerHTML=s;
}

var EMOS=['calm','FOMO','revenge','anxious','confident','bored','other'];
function tkey(x){return (x.date||'')+' '+(x.time||'');}
function emoOpts(sel){return '<option value="">–</option>'+EMOS.map(function(e){return '<option value="'+e+'"'+(sel===e?' selected':'')+'>'+e+'</option>';}).join('');}
function setupsList(){var m={};state.trading.trades.forEach(function(t){if(t.setup)m[t.setup]=1;});return Object.keys(m).sort();}
function jFiltered(){
  var f=ui.jf;
  return state.trading.trades.filter(function(x){
    if(f.from&&x.date<f.from)return false;
    if(f.to&&x.date>f.to)return false;
    if(f.inst&&(x.instrument||'').toLowerCase().indexOf(f.inst.toLowerCase())<0)return false;
    if(f.setup&&(x.setup||'')!==f.setup)return false;
    if(f.dir&&x.dir!==f.dir)return false;
    if(f.emo&&x.emoBefore!==f.emo&&x.emoAfter!==f.emo)return false;
    if(f.plan==='none'&&x.plan)return false;
    if((f.plan==='yes'||f.plan==='no')&&x.plan!==f.plan)return false;
    if(f.res==='win'&&!(num(x.pnl)>0))return false;
    if(f.res==='loss'&&!(num(x.pnl)<0))return false;
    if(f.q){var hay=[x.instrument,x.setup,x.mistakes,x.lessons,x.note].join(' ').toLowerCase();if(hay.indexOf(f.q.toLowerCase())<0)return false;}
    return true;
  });
}
function groupStats(list,keyFn){
  var g={};
  list.forEach(function(x){var k=keyFn(x);if(k==null)return;var o=g[k]||(g[k]={k:k,n:0,w:0,pnl:0});o.n++;if(num(x.pnl)>0)o.w++;o.pnl=r2(o.pnl+num(x.pnl));});
  return Object.keys(g).map(function(k){return g[k];}).sort(function(a,b){return b.pnl-a.pnl;});
}
function winPct(o){return o.n?pct(o.w/o.n*100,0):'–';}
function jStatsTable(title,rows,label){

function resizeImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=640,sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.6));
    };
    img.onerror=function(){toast('Could not read that image');};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

document.addEventListener('change',function(ev){

document.addEventListener('submit',function(ev){
  var f=ev.target;if(!f.dataset.form)return;ev.preventDefault();
  var fd=new FormData(f),g=function(k){return fd.get(k);};
  var kind=f.dataset.form;
  if(kind==='expense'){
    var a=num(g('amount'));if(!(a>0))return;
    state.expenses.push({id:uid(),date:g('date'),cat:g('cat'),amount:a,note:g('note')||''});
  }else if(kind==='payment'){
    var d=state.debts.filter(function(x){return x.id===g('debt');})[0];var amt=num(g('amount'));
    if(!d||!(amt>0))return;
    var applied=Math.min(amt,num(d.balance));
    if(applied<amt&&!confirm('That is more than the '+money(d.balance)+' balance. Log only '+money(applied)+'?'))return;
    if(applied<=0){toast('That debt is already at £0');return;}
    d.balance=r2(num(d.balance)-applied);
    state.payments.push({id:uid(),date:g('date'),debtId:d.id,debtName:d.name,amount:applied,note:g('note')||''});
  }else if(kind==='trade'){
    state.trading.trades.push({id:uid(),date:g('date'),instrument:(g('instrument')||'').trim(),pnl:num(g('pnl')),note:g('note')||''});
    var st=tradingStats();var br=st.breaches.filter(function(b){return b.date===g('date');})[0];
    if(br)toast('⚠ Daily loss limit breached on '+fmtDate(br.date)+': '+money(br.pnl));
  }else if(kind==='journal'){
    var rec={date:g('date'),time:g('time')||'',instrument:(g('instrument')||'').trim(),dir:g('dir')||'',entry:numOrNull(g('entry')),exit:numOrNull(g('exit')),size:numOrNull(g('size')),
      pnl:num(g('pnl')),setup:(g('setup')||'').trim(),emoBefore:g('emoBefore')||'',emoAfter:g('emoAfter')||'',plan:g('plan')||'',
      mistakes:g('mistakes')||'',lessons:g('lessons')||'',note:g('note')||''};
    var ex=ui.editId?state.trading.trades.filter(function(x){return x.id===ui.editId;})[0]:null;
    if(ex)Object.assign(ex,rec);else{rec.id=uid();state.trading.trades.push(rec);ex=rec;}
    if(ui.shot)ex.shot=ui.shot;else delete ex.shot;
    ui.jOpen=false;ui.editId=null;ui.shot='';
    var br2=tradingStats().breaches.filter(function(b){return b.date===rec.date;})[0];
    if(br2)toast('⚠ Daily loss limit breached on '+fmtDate(br2.date)+': '+money(br2.pnl));
  }else if(kind==='cash'){
    var amt2=num(g('amount'));if(!(amt2>0))return;
    if(g('kind')==='deposits'){
      var warn=[];
      if(totalDebt()>0)warn.push('You still owe '+money(totalDebt())+' in debt.');
      var cap=num(state.trading.riskCap);var net=tradingStats().net+amt2;
      if(cap<=0)warn.push('Your trading capital cap is £0 (not set).');else if(net>cap)warn.push('This takes net deposits to '+money(net)+', above your '+money(cap)+' cap.');
      if(warn.length&&!confirm('Trading risk rule warning:\n\n- '+warn.join('\n- ')+'\n\nAdd this deposit anyway?'))return;
    }
    state.trading[g('kind')].push({id:uid(),date:g('date'),amount:amt2,note:g('note')||''});
  }
  save();render();
});
document.addEventListener('click',function(ev){

    case 'del-expense':rm('expenses');break;
    case 'add-debt':state.debts.push({id:uid(),name:'New debt',balance:0,startBalance:0,monthlyInterest:null,min:null,note:''});break;
    case 'del-debt':if(!confirm('Remove this debt?'))return;rm('debts');break;
    case 'del-payment':
      var p=state.payments.filter(function(x){return x.id===id;})[0];
      if(p){var d=state.debts.filter(function(x){return x.id===p.debtId;})[0];if(d)d.balance=r2(num(d.balance)+num(p.amount));}
      rm('payments');break;
    case 'j-new':ui.jOpen=true;ui.editId=null;ui.shot='';ui.tab='journal';render();window.scrollTo(0,0);return;
    case 'j-edit':var te=state.trading.trades.filter(function(x){return x.id===id;})[0];if(!te)return;ui.jOpen=true;ui.editId=id;ui.shot=te.shot||'';ui.tab='journal';render();window.scrollTo(0,0);return;
    case 'j-cancel':ui.jOpen=false;ui.editId=null;ui.shot='';render();return;
    case 'j-del':if(!confirm('Delete this journal entry? It will also be removed from the Trading P&L.'))return;state.trading.trades=state.trading.trades.filter(function(x){return x.id!==id;});if(ui.editId===id){ui.jOpen=false;ui.editId=null;}break;
    case 'j-all':ui.jAll=true;render();return;
    case 'jf-reset':ui.jf={};render();return;
    case 'shot-pick':document.getElementById('shotFile').click();return;
    case 'shot-clear':ui.shot='';var sp=document.getElementById('shotPrev');if(sp)sp.innerHTML=shotPrevHtml();return;
    case 'view-shot':var vt=state.trading.trades.filter(function(x){return x.id===id;})[0];ui.shotView=vt&&vt.shot;render();return;
    case 'view-shot-tmp':ui.shotView=ui.shot;render();return;
    case 'close-shot':ui.shotView=null;render();return;
    case 'wk-prev':ui.wk++;render();return;
    case 'wk-next':if(ui.wk>0)ui.wk--;render();return;
    case 'wk-template':
      var ta=document.getElementById('wkText');if(!ta)return;
      if(ta.value.trim()&&!confirm('Append the prompt template to your current notes?'))return;
      ta.value=(ta.value.trim()?ta.value+'\n\n':'')+'What went well:\n\nBiggest mistake (and cost):\n\nRules I broke / why:\n\nEmotions that drove trades:\n\nOne thing to improve next week:\n\nMy rule for next week:\n';
      ta.dispatchEvent(new Event('input',{bubbles:true}));return;
    case 'del-trade':state.trading.trades=state.trading.trades.filter(function(x){return x.id!==id;});break;
    case 'del-cash':var k=b.dataset.kind;state.trading[k]=state.trading[k].filter(function(x){return x.id!==id;});break;
    case 'clear-trades':if(!confirm('Delete ALL logged trades?'))return;state.trading.trades=[];break;
    case 'show-sched':ui.showAllSched=true;break;
    case 'show-trades':ui.showAllTrades=true;break;
    case 'use-calc':state.trading.balance=tradingStats().calc;break;
    case 'reset':if(!confirm('Reset ALL data to the defaults? This cannot be undone (export first!).'))return;state=defaults();break;
    default:return;
  }
  save();render();
});

/* ---------- export / import ---------- */
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='finance-dashboard-'+todayStr()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Exported backup');
}
function importJSON(text){
  var o;try{o=JSON.parse(text);}catch(e){toast('Invalid JSON file');return;}
  if(!o||typeof o!=='object'||!o.settings||!Array.isArray(o.debts)){toast('Not a dashboard backup file');return;}
  if(!isFirstRun()&&!confirm('Replace all current data with this backup?'))return;
  state=merge(defaults(),o);save();render();toast('Imported backup');
}
function readFileText(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var buf=new Uint8Array(fr.result),enc='utf-8';
    if(buf[0]===0xFF&&buf[1]===0xFE)enc='utf-16le';else if(buf[0]===0xFE&&buf[1]===0xFF)enc='utf-16be';
    cb(new TextDecoder(enc).decode(buf).replace(/^\uFEFF/,''));
  };
  fr.readAsArrayBuffer(file);
}
document.getElementById('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;readFileText(f,importJSON);e.target.value='';

/* ---------- MT5 CSV ---------- */
function parseCSV(text){
  var first=text.split(/\r?\n/).filter(function(l){return l.trim();}).slice(0,15).join('\n');
  var best=',',bc=-1;[',',';','\t'].forEach(function(d){var c=first.split(d).length;if(c>bc){bc=c;best=d;}});
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===best){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim();}))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(function(x){return x.trim();}))rows.push(row);
  return {rows:rows,delim:best};
}
function parseNum(s,delim){
  s=String(s==null?'':s).replace(/[\s\u00a0£$€]/g,'');if(!s)return NaN;
  if(s.indexOf(',')>=0&&s.indexOf('.')<0&&(delim===';'||/,\d{1,2}$/.test(s)&&!/,\d{3}/.test(s)))s=s.replace(',','.');
  else s=s.replace(/,/g,'');
  return parseFloat(s);
}
function parseDateStr(s){
  s=String(s||'');var m=/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/.exec(s);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/.exec(s);
  if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}
function importMT5(text,fees){
  var p=parseCSV(text),rows=p.rows,hi=-1,cols={};
  for(var i=0;i<Math.min(rows.length,60);i++){
    var h=rows[i].map(function(x){return x.trim().toLowerCase();});
    var pr=h.indexOf('profit'); if(pr<0)pr=h.findIndex(function(x){return /profit|p\/l|p&l|pnl/.test(x);});
    var sy=h.findIndex(function(x){return x==='symbol'||x==='instrument'||x==='item';});
    var tm=-1;h.forEach(function(x,j){if(/^(time|date|open time|close time|time\s*\(.*\)|date\/time)$/.test(x)||/time|date/.test(x)&&tm<0)tm=j;});
    // prefer the LAST plain "time" column (close time in positions reports)
    var tms=[];h.forEach(function(x,j){if(/time|date/.test(x))tms.push(j);});
    if(tms.length)tm=tms[tms.length-1];
    if(pr>=0&&sy>=0&&tm>=0){
      hi=i;cols={profit:pr,symbol:sy,time:tm,
        comm:h.findIndex(function(x){return x==='commission'||x==='fee';}),
        swap:h.indexOf('swap'),
        type:h.indexOf('type'),comment:h.findIndex(function(x){return x==='comment';})};
      break;
    }
  }
  if(hi<0)return {added:0,msg:'Could not find Time/Date, Symbol and Profit columns in that file'};
  var added=0,skipped=0,dup=0;var seen={};
  state.trading.trades.forEach(function(t){if(t.src)seen[t.src]=1;});
  for(var r=hi+1;r<rows.length;r++){
    var row=rows[r];var sym=(row[cols.symbol]||'').trim();
    var type=cols.type>=0?(row[cols.type]||'').trim().toLowerCase():'';
    var date=parseDateStr(row[cols.time]);var pnl=parseNum(row[cols.profit],p.delim);
    if(!sym||!date||!isFinite(pnl)||type==='balance'||type==='credit'){skipped++;continue;}
    if(fees){
      if(cols.comm>=0){var c=parseNum(row[cols.comm],p.delim);if(isFinite(c))pnl+=c;}
      if(cols.swap>=0){var sw=parseNum(row[cols.swap],p.delim);if(isFinite(sw))pnl+=sw;}
    }
    pnl=r2(pnl);
    var src=[row[cols.time],sym,row[cols.profit],type,row[cols.comm]||'',row[cols.swap]||''].join('|');
    if(seen[src]){dup++;continue;}
    seen[src]=1;
    state.trading.trades.push({id:uid(),date:date,instrument:sym,pnl:pnl,note:'MT5 import'+(type?' ('+type+')':''),src:src});
    added++;
  }
  save();
  return {added:added,msg:'Imported '+added+' trades'+(dup?', '+dup+' duplicates skipped':'')+(skipped?', '+skipped+' non-trade rows skipped':'')};
}
